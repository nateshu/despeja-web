<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Despeja</title>
  <!-- NATESHU: Símbolo de Despeja: una «D» angulosa en neón (magenta → violeta → cian) cortada por
       un tajo diagonal naranja que la "despeja", con nodos de red encendidos a lo largo del corte.
       Los bordes desplazados en cian y magenta imitan la aberración de color de una pantalla. -->
  <defs>
    <linearGradient id="dsp-d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset=".5" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="dsp-blade" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d00"/>
      <stop offset=".55" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#ffe14d"/>
    </linearGradient>
    <filter id="dsp-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dsp-node" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="dsp-cut">
      <rect width="512" height="512" fill="#fff"/>
      <polygon points="70,452 404,58 456,58 122,452" fill="#000"/>
    </mask>
  </defs>

  <!-- NATESHU: La «D»: borde izquierdo en punta, como una flecha que avanza. -->
  <g mask="url(#dsp-cut)" fill-rule="evenodd">
    <path transform="translate(-9 0)" fill="#00e5ff" opacity=".55"
      d="M118 96H286C384 96 440 166 440 256C440 346 384 416 286 416H118L150 256Z M214 166H280C334 166 368 204 368 256C368 308 334 346 280 346H214Z"/>
    <path transform="translate(9 0)" fill="#ff2bd6" opacity=".55"
      d="M118 96H286C384 96 440 166 440 256C440 346 384 416 286 416H118L150 256Z M214 166H280C334 166 368 204 368 256C368 308 334 346 280 346H214Z"/>
    <path fill="url(#dsp-d)" filter="url(#dsp-glow)"
      d="M118 96H286C384 96 440 166 440 256C440 346 384 416 286 416H118L150 256Z M214 166H280C334 166 368 204 368 256C368 308 334 346 280 346H214Z"/>
  </g>

  <!-- NATESHU: El tajo que despeja. -->
  <polygon points="92,446 412,68 436,68 116,446" fill="url(#dsp-blade)" filter="url(#dsp-glow)"/>

  <!-- NATESHU: Red de nodos encendidos a lo largo del corte. -->
  <g stroke="#bff8ff" stroke-width="3" stroke-linecap="round" opacity=".9">
    <line x1="190" y1="330" x2="246" y2="300"/>
    <line x1="246" y1="300" x2="268" y2="238"/>
    <line x1="268" y1="238" x2="330" y2="214"/>
    <line x1="246" y1="300" x2="312" y2="292"/>
    <line x1="268" y1="238" x2="222" y2="214"/>
  </g>
  <g fill="#ffffff" filter="url(#dsp-node)">
    <circle cx="190" cy="330" r="8"/>
    <circle cx="246" cy="300" r="10"/>
    <circle cx="268" cy="238" r="10"/>
    <circle cx="330" cy="214" r="8"/>
    <circle cx="312" cy="292" r="7"/>
    <circle cx="222" cy="214" r="7"/>
  </g>
</svg>
